# Managed by the Hazelnut release process. Hand-edits may be replaced on the next release.
# Prefer opening an issue over editing this file directly.

name: publish

on:
  push:
    tags: ["v*", "*@*"]

permissions:
  contents: read
  id-token: write # JSR authenticates this publish by OIDC; no token is stored in this repository

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # One tag publishes ONE workspace member. Core: `v<version>`. A module: `<name>@<version>`.
      # The registry publishes that member's deno.json version, not the tag string; a mismatch is
      # permanent. Members whose version did not move are not republished.
      - name: tag names one package version
        run: |
          ref="${GITHUB_REF_NAME}"
          if [[ "$ref" == v* ]]; then pkg="core"; ver="${ref#v}"; else pkg="${ref%@*}"; ver="${ref#*@}"; fi
          members="$(jq -r '.workspace[]' deno.json | sed 's|^./||')"
          echo "$members" | grep -qx "$pkg" || { echo "tag $ref does not name a workspace member" >&2; exit 1; }
          manifest="$(jq -r .version "$pkg/deno.json")"
          if [ "$ver" != "$manifest" ]; then
            echo "tag $ref declares $ver, but $pkg/deno.json declares $manifest" >&2
            exit 1
          fi
          echo "PUBLISH_DIR=$pkg" >> "$GITHUB_ENV"

      - run: deno publish
        working-directory: ${{ env.PUBLISH_DIR }}
